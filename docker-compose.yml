services:

  qdrant:
    image: qdrant/qdrant:v1.19.2
    volumes:
      - qdrant_storage:/qdrant/storage
    ports:
      - "6333:6333"   # REST API
      - "6334:6334"   # gRPC, used internally by the client for faster transfers

  # embd-model:
  #   image: ai/all-minilm-l6-v2-vllm
  #   command: --model-id sentence-transformers/all-MiniLM-L6-v2
  #   volumes:
  #     - embd_model:/data                   # model is downloaded here once
  #   # environment:
  #   #   - HF_HUB_OFFLINE=${HF_HUB_OFFLINE:-0}
  #   ports: ["8080:80"]

  dashboard:
    build: ./dashboard
    profiles: ["p1", "p2", "p3"]
    environment:
      IOC_SOURCE: direct
      QDRANT_URL: http://qdrant:6333
      QDRANT_COLLECTION: chunks
      TARGET_PATH: /workspace
      LOG_FILE: /ioc/events/events.jsonl
    volumes:
      - ${TARGET_DIR:-./target}:/workspace:ro
      - index_events:/ioc/events/
    depends_on:
      - qdrant
    ports:
      - "8080:8080"

  indexer:
      build: ./p1
      environment:
        IOC_TARGET: /workspace
        QDRANT_HOST: qdrant
        QDRANT_PORT: 6333
        LOG_FILE: /ioc/events/events.jsonl
        LOG_LEVEL: INFO
      volumes:
        - ./target:/workspace
        - index_events:/ioc/events/
      depends_on:
        - qdrant

volumes:
  qdrant_storage:
  index_events:
  embd_model: