services:

  qdrant:
    image: qdrant/qdrant:v1.19.2
    volumes:
      - qdrant_storage:/qdrant/storage
    ports:
      - "6333:6333"   # REST API
      - "6334:6334"   # gRPC, used internally by the client for faster transfers

  dashboard:
    build: ./dashboard
    profiles: ["p1", "p2", "p3"]
    environment:
      IOC_SOURCE: direct
      QDRANT_URL: http://qdrant:6333
      QDRANT_COLLECTION: chunks
      TARGET_PATH: /workspace
      EVENTS_LOG: /ioc/events/events.jsonl
    volumes:
      - ${TARGET_DIR:-./target}:/workspace:ro
      - index_events:/ioc/events/
    depends_on:
      - qdrant
    ports:
      - "8080:8080"

  indexer:
      build: ./p1
      environment:
        - IOC_TARGET=/workspace
        - QDRANT_HOST=qdrant
        - QDRANT_PORT=6333
      volumes:
        - ./target:/workspace
      depends_on:
        - qdrant

volumes:
  qdrant_storage:
  index_events: